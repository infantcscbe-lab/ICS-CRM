<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/ics-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICS Service Manager</title>
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
  </head>
  <body>
    <script>
      // Suppress noisy third-party browser extension / VM errors from polluting developer console
      window.addEventListener('error', function (event) {
        if (
          event.message &&
          (event.message.includes('startTime') ||
            event.message.includes('reportAllChanges') ||
            event.filename.includes('extensions::') ||
            event.filename.startsWith('chrome-extension://'))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event.reason &&
          typeof event.reason.message === 'string' &&
          event.reason.message.includes('startTime')
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
