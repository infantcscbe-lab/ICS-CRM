<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/ics-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ICS Service Manager — Cloud-based Field Service CRM for managing engineers, clients, service jobs, live GPS tracking, and comprehensive reports." />
    <meta name="theme-color" content="#0f172a" />
    <title>ICS Service Manager</title>
    <meta property="og:title" content="ICS Service Manager" />
    <meta property="og:description" content="Cloud-based field service CRM with live GPS tracking, job management, and reports." />
    <meta property="og:image" content="/ics-logo.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script>
      // Polyfill all performance methods for Chrome extension timing scripts (autofill/translation)
      if (typeof window !== 'undefined' && window.performance) {
        const dummyEntry = {
          startTime: 0,
          duration: 0,
          entryType: 'measure',
          name: '',
          toJSON: function() { return this; }
        };

        const origByName = window.performance.getEntriesByName?.bind(window.performance);
        window.performance.getEntriesByName = function(name, type) {
          try {
            const res = origByName ? origByName(name, type) : [];
            return (res && res.length > 0) ? res : [{ ...dummyEntry, name: name || '', startTime: performance.now() }];
          } catch {
            return [{ ...dummyEntry, name: name || '', startTime: performance.now() }];
          }
        };

        const origByType = window.performance.getEntriesByType?.bind(window.performance);
        window.performance.getEntriesByType = function(type) {
          try {
            const res = origByType ? origByType(type) : [];
            return (res && res.length > 0) ? res : [{ ...dummyEntry, entryType: type || 'measure', startTime: performance.now() }];
          } catch {
            return [{ ...dummyEntry, entryType: type || 'measure', startTime: performance.now() }];
          }
        };

        const origGetEntries = window.performance.getEntries?.bind(window.performance);
        window.performance.getEntries = function() {
          try {
            const res = origGetEntries ? origGetEntries() : [];
            return (res && res.length > 0) ? res : [{ ...dummyEntry, startTime: performance.now() }];
          } catch {
            return [{ ...dummyEntry, startTime: performance.now() }];
          }
        };

        // Silence VM extension logs & errors
        window.onerror = function(msg, url, line, col, error) {
          const str = String(msg || '') + String(error?.stack || '') + String(url || '');
          if (str.includes('startTime') || str.includes('reportAllChanges') || str.includes('VM')) {
            return true; // Suppress browser console output
          }
          return false;
        };

        window.addEventListener('error', function(e) {
          const msg = String(e.message || e.error?.message || e.error?.stack || '');
          if (msg.includes('startTime') || msg.includes('reportAllChanges') || (e.filename && e.filename.includes('VM'))) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          const msg = String(e.reason?.message || e.reason?.stack || e.reason || '');
          if (msg.includes('startTime') || msg.includes('reportAllChanges')) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
