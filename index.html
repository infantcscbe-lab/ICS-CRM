<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/ics-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ICS Service Manager — Cloud-based Field Service CRM for managing engineers, clients, service jobs, live GPS tracking, and comprehensive reports." />
    <meta name="theme-color" content="#0f172a" />
    <title>ICS Service Manager</title>
    <meta property="og:title" content="ICS Service Manager" />
    <meta property="og:description" content="Cloud-based field service CRM with live GPS tracking, job management, and reports." />
    <meta property="og:image" content="/ics-logo.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script>
      // 1. Polyfill performance entries for background autofill/translator VM scripts
      if (typeof window !== 'undefined') {
        const origGetEntries = window.performance?.getEntriesByName?.bind(window.performance);
        if (window.performance) {
          window.performance.getEntriesByName = function (name, type) {
            const res = origGetEntries ? origGetEntries(name, type) : [];
            if (!res || res.length === 0) {
              return [{ startTime: performance.now(), duration: 0, entryType: 'measure', name: name || '' }];
            }
            return res;
          };
        }

        // 2. Intercept console.error to silence VM extension logs
        const origConsoleError = console.error.bind(console);
        console.error = function (...args) {
          const msg = args.map((a) => (typeof a === 'string' ? a : a?.message || a?.stack || '')).join(' ');
          if (msg.includes('startTime') || msg.includes('reportAllChanges')) {
            return; // Silence third-party VM noise
          }
          origConsoleError(...args);
        };

        window.addEventListener('error', function (e) {
          const msg = e.message || e.error?.message || '';
          if (msg.includes('startTime') || msg.includes('reportAllChanges') || (e.filename && e.filename.includes('VM'))) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          const msg = e.reason?.message || String(e.reason || '');
          if (msg.includes('startTime') || msg.includes('reportAllChanges')) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
